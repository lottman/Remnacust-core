name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xray
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: xray/go.sum
      - run: go test ./infra/conf ./transport/internet/xerahttp ./app/dispatcher ./app/proxyman/command
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/remnacust-xray ./main
      - run: python3 ../tests/version.test.py /tmp/remnacust-xray
      - run: python3 ../tests/device-revoke.integration.py /tmp/remnacust-xray
