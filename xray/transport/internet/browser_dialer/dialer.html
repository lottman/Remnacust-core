<!DOCTYPE html>
<html>
<head>
	<title>Browser Dialer</title>
	<link rel="icon" href="data:">
</head>
<body>
	<script>
		"use strict";
		// Enable a much more aggressive JIT for performance gains

		// Copyright (c) 2021 XRAY. Mozilla Public License 2.0.
		let url = "ws://" + window.location.host + "/websocket?token=csrfToken";
		let clientIdleCount = 0;
		let upstreamGetCount = 0;
		let upstreamWsCount = 0;
		let upstreamPostCount = 0;
		const taskFailureCode = 4000;

		function isTaskRecord(value) {
			return value !== null && typeof value === "object" && !Array.isArray(value);
		}

		function prepareRequestInit(extra) {
			const requestInit = {redirect: "error", cache: "no-store"};
			if (extra.referrer) {
				// note: we have to strip the protocol and host part.
				// Browsers disallow that, and will reset the value to current page if attempted.
				const referrer = new URL(extra.referrer);
				requestInit.referrer = referrer.pathname + referrer.search + referrer.hash;
				requestInit.referrerPolicy = "unsafe-url";
			}

			if (extra.headers) {
				requestInit.headers = new Headers(extra.headers);
			}

			if (extra.cookies) {
				requestInit.credentials = 'include';
			}

			return requestInit;
		}

		function setCookiesFromTask(task) {
			if (!task.extra || !task.extra.cookies) {
				return;
			}

			const url = new URL(task.url);

			for (const [name, value] of Object.entries(task.extra.cookies)) {
				document.cookie = encodeURIComponent(name) + '=' + encodeURIComponent(value) + '; path=' + url.pathname;
			}
		}

		function clearCookiesFromTask(task) {
			if (!task.extra || !task.extra.cookies) {
				return;
			}

			const url = new URL(task.url);

			for (const [name, value] of Object.entries(task.extra.cookies)) {
				document.cookie = encodeURIComponent(name) + '=; path=' + url.pathname + '; Max-Age=0';
			}
		}

		let check = function () {
			if (clientIdleCount > 0) {
				return;
			}
			clientIdleCount += 1;
			console.log("Prepare browser connection");
			let ws = new WebSocket(url);
			// arraybuffer is significantly faster in chrome than default
			// blob, tested with chrome 123
			ws.binaryType = "arraybuffer";
			// note: this event listener is later overwritten after the
			// handshake has completed. do not attempt to modernize it without
			// double-checking that this continues to work
			ws.onmessage = function (event) {
				clientIdleCount -= 1;
				let task, requestInit, wss;
				try {
					if (typeof event.data !== "string") throw new Error();
					task = JSON.parse(event.data);
					if (!isTaskRecord(task) || typeof task.method !== "string" || !task.method || typeof task.url !== "string" || typeof task.streamResponse !== "boolean") throw new Error();
					task.extra ??= {};
					if (!isTaskRecord(task.extra)) throw new Error();
					for (const name of ["headers", "cookies"]) {
						const value = task.extra[name];
						if (value !== undefined && (!isTaskRecord(value) || !Object.values(value).every(item => typeof item === "string"))) throw new Error();
					}
					if (task.extra.referrer !== undefined && typeof task.extra.referrer !== "string" || task.extra.protocol !== undefined && typeof task.extra.protocol !== "string") throw new Error();
					const target = new URL(task.url);
					if (task.method === "WS") {
						if (!task.streamResponse || !["ws:", "wss:"].includes(target.protocol)) throw new Error();
						wss = new WebSocket(task.url, task.extra.protocol || []);
					} else {
						if (task.streamResponse && task.method !== "GET" || !["http:", "https:"].includes(target.protocol)) throw new Error();
						requestInit = prepareRequestInit(task.extra);
						requestInit.method = task.method;
						new Request(task.url, requestInit);
					}
				} catch (error) {
					ws.close(taskFailureCode, "Browser task failed");
					check();
					return;
				}
				if (task.method == "WS") {
					upstreamWsCount += 1;
					console.log("Dial WS");
					wss.binaryType = "arraybuffer";
					let opened = false;
					ws.onmessage = function (event) {
						wss.send(event.data)
					};
					wss.onopen = function (event) {
						opened = true;
						ws.send("ok")
					};
					wss.onmessage = function (event) {
						ws.send(event.data)
					};
					wss.onclose = function (event) {
						upstreamWsCount -= 1;
						console.log("Dial WS DONE, remaining: ", upstreamWsCount);
						ws.close()
					};
					wss.onerror = function (event) {
						!opened && ws.send("fail")
						wss.close()
					};
					ws.onclose = function (event) {
						wss.close()
					};
				}
				else if (task.method == "GET" && task.streamResponse) {
					(async () => {
						console.log("Dial GET");
						const controller = new AbortController();

						/*
						Aborting a streaming response in JavaScript
						requires two levers to be pulled:

						First, the streaming read itself has to be cancelled using
						reader.cancel(), only then controller.abort() will actually work.

						If controller.abort() alone is called while a
						reader.read() is ongoing, it will block until the server closes the
						response, the page is refreshed or the network connection is lost.
						*/

						let reader = null;
						ws.onclose = (event) => {
							try {
								reader && reader.cancel().catch(() => {});
							} catch(e) {}

							try {
								controller.abort();
							} catch(e) {}
						};

						try {
							upstreamGetCount += 1;
							ws.send("ok");

							requestInit.signal = controller.signal;
							setCookiesFromTask(task);
							const response = await fetch(task.url, requestInit);
							clearCookiesFromTask(task);
							if (response.status !== 200) {
								ws.close(taskFailureCode, "Browser task failed");
								return;
							}

							const body = await response.body;
							reader = body.getReader();

							while (true) {
								const { done, value } = await reader.read();
								if (value) ws.send(value);  // don't send back "undefined" string when received nothing
								if (done) break;
							}
						} catch (error) {
							ws.close(taskFailureCode, "Browser task failed");
						} finally {
							upstreamGetCount -= 1;
							console.log("Dial GET DONE, remaining: ", upstreamGetCount);
							if (ws.readyState === WebSocket.OPEN) ws.close();
						}
					})();
				}
				else if (!task.streamResponse) {
					upstreamPostCount += 1;

					console.log("Dial HTTP");
					ws.send("ok");
					ws.onmessage = async (event) => {
						try {
							if (event.data.byteLength > 0) {
								requestInit.body = event.data;
							}
							setCookiesFromTask(task);
							const response = await fetch(task.url, requestInit);
							clearCookiesFromTask(task);
							if (response.status === 200) {
								ws.send("ok");
							} else {
								console.error("bad status code");
								ws.send("fail");
							}
						} catch (error) {
							ws.send("fail");
						} finally {
							upstreamPostCount -= 1;
							console.log("Dial HTTP packet DONE, remaining: ", upstreamPostCount);
							ws.close();
						}
					};
				}
				else {
					ws.close(taskFailureCode, "Browser task failed");
				}

				check();
			};
			ws.onerror = function (event) {
				ws.close();
			};
		};
		let checkTask = setInterval(check, 1000);
	</script>
</body>
</html>
